/* design.md → AX브릿지. 원본 색상·간격 + 한국어 타입 조정. */
@font-face{font-family:'Pretendard Variable';font-style:normal;font-weight:100 900;font-display:swap;src:url('public/assets/PretendardVariable.woff2') format('woff2')}
:root{
  --ds-surface:#fff;--ds-soft:#f5f6f6;--ds-section:#fafafa;
  --ds-text:#1f2022;--ds-secondary:#595c61;--ds-muted:#676d73;
  --ds-border:#d3d4d5;--ds-input-border:#dddee1;
  --ds-brand:#009fd9;--ds-link:#0175a3;--ds-brand-soft:#e0f4fe;
  --ds-action:#07344a;--ds-action-hover:#094d6b;--ds-action-pressed:#052a3a;--ds-on-action:#b3ebff;
  --ds-success:#256548;--ds-success-soft:#eaf5ee;--ds-danger:#ab2a27;--ds-danger-soft:#fff1f0;
  --ds-warning:#875416;--ds-warning-soft:#fff6e5;
  --ds-space-1:4px;--ds-space-2:8px;--ds-space-3:12px;--ds-space-4:16px;--ds-space-5:20px;
  --ds-space-6:24px;--ds-space-7:32px;--ds-space-8:48px;--ds-space-9:64px;--ds-space-10:96px;
  --ds-radius-small:8px;--ds-radius-card:16px;--ds-radius-panel:24px;--ds-radius-pill:9999px;
  --ds-shadow:0 2px 4px rgb(0 0 0 / .08);--ds-wrap:946px;--ds-search:588px;
  --ds-font:'Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --ds-motion:200ms;--ds-header:72px;
}

/* 기존 운영 화면의 구조를 유지하면서 새 공통 토큰으로 이행합니다. */
:root{
 --ink:var(--ds-text);--muted:var(--ds-muted);--line:var(--ds-input-border);--bg:var(--ds-soft);
 --green:var(--ds-brand-soft);--green-ink:var(--ds-action);--blue:var(--ds-link);--orange:var(--ds-warning);
 --shadow:var(--ds-shadow);--radius:var(--ds-radius-card);
 --portal-accent:var(--ds-on-action);--portal-deep:var(--ds-action);--portal-soft:var(--ds-brand-soft);--portal-border:var(--ds-input-border);
 font-family:var(--ds-font);color:var(--ds-text);
}
body,body[data-portal-role=supplier]{background:var(--ds-soft);--portal-accent:var(--ds-on-action);--portal-deep:var(--ds-action);--portal-soft:var(--ds-brand-soft);--portal-border:var(--ds-input-border)}
body,button,input,select,textarea{font-family:var(--ds-font)}
body{line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
::selection{background:var(--ds-brand-soft);color:var(--ds-action)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ds-brand);outline-offset:3px}
.brand{color:var(--ds-action);letter-spacing:-.8px}.brandmark,.portal-header .brandmark{background:var(--ds-action);color:var(--ds-on-action)}
.sidebar{border-color:var(--ds-input-border)}.nav a{color:var(--ds-secondary)}.nav a:hover{background:var(--ds-soft)}.nav a.active{background:var(--ds-brand-soft);color:var(--ds-action)}.nav .count{background:white;color:var(--ds-action)}

.avatar,.company-icon{background:var(--ds-brand-soft);border-color:var(--ds-input-border);color:var(--ds-action)}

.page-head h1,.portal-page-head h1{font-weight:650;letter-spacing:-.035em}.page-head p,.portal-page-head p{color:var(--ds-secondary);font-size:14px}
.btn{border-radius:var(--ds-radius-pill);border-color:var(--ds-border);color:var(--ds-text);min-height:44px;transition:background var(--ds-motion);white-space:normal}
.btn:hover{background:var(--ds-soft);border-color:var(--ds-border)}.btn.primary{background:var(--ds-action);color:var(--ds-on-action);border-color:var(--ds-action)}.btn.primary:hover{background:var(--ds-action-hover)}.btn.primary:active{background:var(--ds-action-pressed)}.btn.soft{background:var(--ds-brand-soft);color:var(--ds-action);border-color:var(--ds-brand-soft)}.btn.danger{background:var(--ds-danger-soft);color:var(--ds-danger)}.btn.small{border-radius:var(--ds-radius-pill)}
.icon-btn{color:var(--ds-secondary)}.icon-btn:hover{background:var(--ds-brand-soft);color:var(--ds-action)}
.stat,.pipeline-panel,.panel,.table-wrap,.project-card,.portal-card,.portal-stat,.portal-identity,.portal-quote-card,.portal-milestone,.signup-form-card{border-color:var(--ds-input-border);box-shadow:none;border-radius:var(--ds-radius-card)}
.stat.top{background:var(--ds-action);border-color:var(--ds-action);color:white}.stat.top .stat-note,.stat.top .stat-title{color:var(--ds-on-action)}
.stat-title,.stat-note,.section-title p,.row-sub,.todo-sub,.demo-notice{color:var(--ds-muted)}.section-title a,.signup-bottom a{color:var(--ds-link)}
.stat-number{font-weight:600}.section-title h2{font-weight:650}
.field input,.field select,.field textarea,.filter,.search,.operator-role,.portal-identity select,.portal-filter select{border-color:var(--ds-input-border);background:white;color:var(--ds-text);border-radius:var(--ds-radius-small)}
.field label{color:var(--ds-secondary);font-size:13px}.field input,.field select,.field textarea{font-size:14px;min-height:44px}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ds-brand);box-shadow:0 0 0 1px var(--ds-brand)}
input[type=checkbox],input[type=radio]{accent-color:var(--ds-action)}
.badge.completed,.badge.approved{background:var(--ds-success-soft);color:var(--ds-success)}.badge.progress,.badge.submitted{background:var(--ds-brand-soft);color:var(--ds-action)}.badge.quotation,.badge.revision{background:var(--ds-warning-soft);color:var(--ds-warning)}

" data-value=\"reference\" class=\"\">예산 · 기관 모집 참고자료 3\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"suppliers-grid\">\u003carticle class=\"supplier-card\">\u003cdiv class=\"supplier-top\">\u003cspan class=\"tag\">2026년\u003c/span>\u003cdiv>\u003cspan class=\"badge verified\">공식 확인 기록\u003c/span>\u003cbutton type=\"button\" class=\"icon-btn\" data-action=\"edit-program\" aria-label=\"지원사업 수정\" title=\"지원사업 수정\" data-id=\"13e6f259-5d92-42bc-beba-d26af18969da\">\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"m15 4 5 5M4 20l1-6L16 3a2 2 0 0 1 3 0l2 2a2 2 0 0 1 0 3L10 19z\"/>\u003c/svg>\u003c/button>\u003c/div>\u003c/div>\u003ch2 class=\"spaced\">[충북] 2026년 제조 AI 현장 적용 지원 사업 수혜기업 모집 공고\u003c/h2>\u003cdiv class=\"tags\">\u003cspan class=\"tag\">실제 모집공고\u003c/span>\u003cspan class=\"tag\">접수기간 내 · 지역/업종 제한\u003c/span>\u003c/div>\u003cp>기업당 최대 8,000만원(VAT 별도). 제조 공정용 AI 개발·실증에 데이터 컨설팅, AX 검증, 사후관리를 묶어 지원. 협약일부터 10개월 예정.\u003c/p>\u003cdiv class=\"facts\">\u003cdiv class=\"fact\">\u003clabel>접수 기간\u003c/label>\u003cdiv>2026.09.16 ~ 2026.10.11\u003c/div>\u003c/div>\u003cdiv class=\"fact\">\u003clabel>자부담 조건\u003c/label>\u003cdiv>중소기업 500만원 이상, 중견기업 1,000만원 이상. VAT 별도. 최대지원 예시는 중소기업 총 8,500만원, 중견기업 총 9,000만원이며 세부 집행조건 확인 필요.\u003c/div>\u003c/div>\u003c/div>\u003ch3 class=\"row-sub spaced\">지원 대상 요건\u003c/h3>\u003cp>충주시·진천군·음성군에 본사 또는 공장 등이 있고 제조공정을 보유한 융합바이오 분야 중소·중견기업. 대표 분야는 의료·바이오·화장품·식품·제지. 수요기업과 공급기업의 컨소시엄이 필요하며 세부 배제요건은 원문 확인.\u003c/p>\u003ca class=\"text-link\" href=\"https://www.bizinfo.go.kr/sii/siia/selectSIIA200Detail.do?pblancId=PBLN_000000000126558\" target=\"_blank\" rel=\"noopener noreferrer\">공식 자료 보기\u003c/a>\u003cdiv class=\"notice-small\">확인 기준: 2026-10-05T08:47:32+09:00\u003cbr>공고문 p.3 접수기간 2026-09-16~2026-10-11 16:00; 기준시각이 기간 안에 있음. p.1 지원대상·한도·자부담, p.4 컨소시엄 요건 확인.\u003c/div>\u003cp class=\"spaced\">실제 수혜기업 모집 공고. 2026-10-05 08:47 KST 기준 접수기간 내이나 충북 3개 시·군과 융합바이오 제조기업에 한정. 마감 2026-10-11 16:00 KST. 공고 PDF는 9/16, 기업마당 등록은 9/17. 사 6592&amp;tab=2\" target=\"_blank\" rel=\"noopener noreferrer\">공식 자료 보기\u003c/a>\u003cdiv class=\"notice-small\">확인 기준: 2026-10-05T08:47:32+09:00\u003cbr>NIPA 원문 본문의 전산접수 개시일 3/16 및 마감일시 3/30 15:00 확인. 기준일 10/5는 마감 이후.\u003c/div>\u003cp class=\"spaced\">실제 모집공고이나 현재 마감. 공고일은 2026-02-27, 이번 수정 게시일은 3/20. 본문은 전산 접수 개시 3/16로 안내하므로 게시판의 수정공고 시작값(3/20)과 구분. 접수 마감은 3/30 15:00 KST. 2027 동일 사업 모집 일정·한도는 이 공고로 확정할 수 없음.\u003c/p>\u003cbutton type=\"button\" class=\"btn small\" data-action=\"new-application\" data-program=\"dc001252-81dd-49e5-a1ca-b45f7fdd0990\">\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M12 5v14M5 12h14\"/>\u003c/svg>고객 의뢰 연결\u003c/button>\u003c/article>\u003carticle class=\"supplier-card\">\u003cdiv class=\"supplier-top\">\u003cspan class=\"tag\">2026년\u003c/span>\u003cdiv>\u003cspan class=\"badge verified\">공식 확인 기록\u003c/span>\u003cbutton type=\"button\" class=\"icon-btn\" data-action=\"edit-program\" aria-label=\"지원사업 수정\" title=\"지원사업 수정\" data-id=\"9d6c90b5-a1d0-43fb-b731-af88bd4a334b\">\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"m15 4 5 5M4 20l1-6L16 3a2 2 0 0 1 3 0l2 2a2 2 0 0 1 0 3L10 19z\"/>\u003c/svg>\u003c/button>\u003c/div>\u003c/div>\u003ch2 class=\"spaced\">2026년 2차 스마트상점 기술보급사업 참여 소상공인 모집 공고(구입형·렌탈형·S/W형)\u003c/h2>\u003cdiv class=\"tags\">\u003cspan class=\"tag\">실제 모집공고\u003c/span>\u003cspan class=\"tag\">접수 마감\u003c/span>\u003c/div>\u003cp>구입형 최대 500만원(배리어프리 700만원), 렌탈형 연 최대 350만원·최대 2년, S/W형 점포당 연 최대 30만원·최대 2년. 유형별 지원율 및 한도 적용.\u003c/p>\u003cdiv class=\"facts\">\u003cdiv class=\"fact\">\u003clabel>접수 기간\u003c/label>\u003cdiv>2026.08.26 ~ 2026.09.30\u003c/div>\u003c/div>\u003cdiv class=\"fact\">\u003clabel>자부담 조건\u003c/label>\u003cdiv>보편기술 국비 50%(우대 60%), 일반·배리어프리·렌탈 국비 70%(우대 80%), S/W 개인형 100%·가맹본부형 90%. 국비 외 금액·한도 초과액·VAT는 소상공인 부담. 우대 대상 증빙 필요.\u003c/div>\u003c/div>\u003c/div>\u003ch3 class=\"row-sub spaced\">지원 대상 요건\u003c/h3>\u003cp>신청일에 정상 영업 중이고 소상공인확인서 발급이 가능한 점포. 공단에 등록된 기술만 지원. 유형별 a8-b45f-f8836ff817ea\">\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"m15 4 5 5M4 20l1-6L16 3a2 2 0 0 1 3 0l2 2a2 2 0 0 1 0 3L10 19z\"/>\u003c/svg>\u003c/button>\u003c/div>\u003c/div>\u003ch2 class=\"spaced\">2027년 스마트공장 구축지원사업 주관기관 모집 공고\u003c/h2>\u003cdiv class=\"tags\">\u003cspan class=\"tag\">기관 모집공고\u003c/span>\u003cspan class=\"tag\">기관 접수기간 내 · 일반기업 공고 전\u003c/span>\u003c/div>\u003cp>2027년 스마트공장 관련 사업의 과제 선정·관리 및 제조혁신 지원을 수행할 기관 선정. 예산·운영비·연계 과제 등 세부사항은 후속 절차에 따라 확정.\u003c/p>\u003cdiv class=\"facts\">\u003cdiv class=\"fact\">\u003clabel>접수 기간\u003c/label>\u003cdiv>2026.09.16 ~ 2026.10.13\u003c/div>\u003c/div>\u003cdiv class=\"fact\">\u003clabel>자부담 조건\u003c/label>\u003cdiv>유형별 기관 운영·재원 조건 적용. 일반 수요기업 자부담을 이 공고로 확정하면 안 됨. 개별 도입기업 조건은 후속 통합공고 확인.\u003c/div>\u003c/div>\u003c/div>\u003ch3 class=\"row-sub spaced\">지원 대상 요건\u003c/h3>\u003cp>기업을 지원·관리하는 주관기관 모집. 업종특화는 부처·지자체 추천 공공·민간기관, 지역성장은 19개 지역 TP 및 한국산업단지공단, 상생협력은 주관기관·상생기관 컨소시엄 등 유형별 자격 적용. 일반 도입기업 모집은 아님.\u003c/p>\u003ca class=\"text-link\" href=\"https://www.mss.go.kr/site/smba/ex/bbs/View.do?bcIdx=1071206&amp;cbIdx=310&amp;parentSeq=1071206\" target=\"_blank\" rel=\"noopener noreferrer\">공식 자료 보기\u003c/a>\u003cdiv class=\"notice-small\">확인 기준: 2026-10-05T08:47:32+09:00\u003cbr>중기부 게시판 및 공고 PDF p.1, p.13 확인: 주관기관 신청 2026-09-16~10-13 17:00. p.1에 도입기업은 주관기관 선정 후 11월 통합공고 예정 명시.\u003c/div>\u003cp class=\"spaced\">실제 발표된 2027 사업의 주관기관 모집공고 제2026-559호. 10/5 기준 기관 접수기간 내(10/13 17:00 마감)이나 일반기업 신청 메뉴에서 제외해야 함. 원문은 도입기업 통합공고를 2026년 11월 예정으로 안내하며 일정 변경 가능. 아직 발표되지 않은 일반기업 모집을 접수중으로 표시하지 않음.\u003c/p>\u003cspan class=\"tag\">신청용이 아닌 정책 참고자료\u003c/span>\u003c/article>\u003carticle class=\"supplier-card\">\u003cdiv class=\"supplier-top\">\u003cspan class=\"tag\">2026년\u003c/span>\u003cdiv>\u003cspan class=\"badge verified\">공식 확인 기록\u003c/span>\u003cbutton type=\"button\" class=\"icon-btn\" data-action=\"edit-program\" aria-label=\"지원사업 수정\" title=\"지원사업 수정\" data-id=\"0d45043f-02da-46de-8509-5f8dc164688e\">\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"m15 4 5 5M4 20l1-6L16 3a2 2 0 0 1 3 0l2 2a2 2 0 0 1 0 3L10 19z\"/>\u003c/svg>\u003c/button>\u003c/div>\u003c/div>\u003ch2 class=\"spaced\">2026년 중소벤처기업부 확정예산 및 AI·제조혁신 관련 예산\u003c/h2>\u003cdiv class=\"tags\">\u003cspan class=\"tag\">확정예산 보도자료\u003c/span>\u003cspan class=\"tag\">정책 참고 · 신청 공고 아님\u003c/span>\u003c/div>\u003cp>2026년 중기부 총지출 16조5,233억원 확정. 사업 전체 예산으로 ICT융합스마트공장보급확산 4,021억원, 지역 주도형 AI 대전환 490억원, 중소기업 혁신바우처 652억원, 대중소상생형스마트공장 400억원을 안내.\u003c/p>\u003cdiv class=\"facts\">\u003cdiv class=\"fact\">\u003clabel>접수 기간\u003c/label>\u003cdiv>미정 ~ 미정\u003c/div>\u003c/div>\u003cdiv class=\"fact\">\u003clabel>자부담 조건\u003c/label>\u003cdiv>이 자료에서는 개별기업 자부담을 확인할 수 없음. 사업별 실제 모집공고 확인 필요.\u003c/div>\u003c/div>\u003c/div>\u003ch3 class=\"row-sub spaced\">지원 대상 요건\u003c/h3>\u003cp>예산 확정 보도자료로 신청대상 공고가 아님. 기업별 지원 자격은 각 사업 모집공고에서 별도 판단.\u003c/p>\u003ca class=\"text-link\" href=\"https://www.mss.go.kr/site/smba/ex/bbs/View.do?bcIdx=1063750&amp;cbIdx=86\" target=\"_blank\" rel=\"noopener noreferrer\">공식 자료 보기\u003c/a>\u003cdiv class=\"notice-small\">확인 기준: 2026-10-05T08:47:32+09:00\u003cbr>중기부 공식 보도자료에 2026년 예산·기금운용계획 총지출이 국회에서 의결·확정되었다고 명시.\u003c/div>\u003cp class=\"spaced\">자료유형: 확정예산 보도자료. 2025-12-02 국회 의결·확정, 12/3 게시. 2026년도 총액·사업별 예산이며 기업당 지원한도가 아님. 항목이 총액과 중복되거나 상하위 관계일 수 있으므로 단순 합산 금지. 본예산 확정 발표 기준으로 추경 이후 최신 총액까지 검증한 자료는 아님.\u003c/p>\u003cspan class=\"tag\">신청용이 아닌 정책 참고자료\u003c/span>\u003c/article>\u003carticle class=\"supplier-card\">\u003cdiv class=\"supplier-top\">\u003cspan class=\"tag\">2027년\u003c/span>\u003cdiv>\u003cspan class=\"badge verified\">공식 확인 기록\u003c/span>\u003cbutton type=\"button\" class=\"icon-btn\" data-action=\"edit-program\" aria-label=\"지원사업 수정\" title=\"지원사업 수정\" data-id=\"10cb5544-ac25-4e88-af4e-2c0055a2770c\">\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"m15 4 5 5M4 20l1-6L16 3a2 2 0 0 1 3 0l2 2a2 2 0 0 1 0 3L10 19z\"/>\u003c/svg>\u003c/button>\u003c/div>\u003c/div>\u003ch2 class=\"spaced\">2027년 중소벤처기업부 예산안: AI·스마트공장 후속계획 참고\u003c/h2>\u003cdiv class=\"tags\">\u003cspan class=\"tag\">예산안 · 후속계획\u003c/span>\u003cspan class=\"tag\">후속계획 참고 · 신청 공고 아님\u003c/span>\u003c/div>\u003cp>2027년 중기부 예산안 총 18조724억원. 사업 전체 편성안으로 ICT융합스마트공장 보급확산 4,682억원, 중소기업 피지컬 AI 실증 1,728억원, 제조AI Fellow 양성 284억원을 제시.\u003c/p>\u003cdiv class=\"facts\">\u003cdiv class=\"fact\">\u003clabel>접수 기간\u003c/label>\u003cdiv>미정 ~ 미정\u003c/div>\u003c/div>\u003cdiv class=\"fact\">\u003clabel>자부담 조건\u003c/label>\u003cdiv>개별기업 자부담 미확정. 예산 확정과 후속 모집공고 확인 필요.\u003c/div>\u003c/div>\u003c/div>\u003ch3 class=\"row-sub spaced\">지원 대상 요건\u003c/h3>\u003cp>예산안 소개자료로 기업 모집공고가 아님. 신청대상·신청일·기업당 지원한도·선정조건 미확정.\u003c/p>\u003ca class=\"text-link\" href=\"https://www.korea.kr/news/policyNewsView.do?newsId=148971047\" target=\"_blank\" rel=\"noopener noreferrer\">공식 자료 보기\u003c/a>\u003cdiv class=\"notice-small\">확인 기준: 2026-10-05T08:47:32+09:00\u003cbr>공식 페이지 제목·본문이 2027년 중소벤처기업부 &#39;예산안&#39;으로 명시. 이 자료에는 기업모집 접수기간이 없음.\u003c/div>\u003cp class=\"spaced\">자료유형: 2027 예산안 정책자료. 2026-09-02 게시. 확정예산 또는 현재 신청 가능한 사업으로 표시 금지. 표시 금액은 기업당 지급액이 아닌 사업·부처 예산안 총액. 제공된 policyFocusView URL과 같은 newsId의 공식 policyNewsView 페이지에서 본문 확인. 이미지·기사 전문은 복제하지 않고 사실 요약과 출처 링크만 사용.\u003c/p>\u003cspan class=\"tag\">신청용이 아닌 정책 참고자료\u003c/span>\u003c/article>\u003c/div>\u003cdiv class=\"section-title spaced\">\u003ch2>고객별 검토 · 신청 현황\u003c/h2>\u003cbutton type=\"button\" class=\"btn small\" data-action=\"new-application\" >\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M12 5v14M5 12h14\"/>\u003c/svg>연결 추가\u003c/button>\u003c/div>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>고객 / 프로젝트\u003c/th>\u003cth>지원사업\u003c/th>\u003cth>진행 상태\u003c/th>\u003cth>다음 할 일\u003c/th>\u003cth>기한\u003c/th>\u003cth>관리\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca href=\"#projects/2c5e3d53-1fdb-4105-be79-c27ab9fbebed\">가상 모노커머스\u003c/a>\u003cdiv cl
